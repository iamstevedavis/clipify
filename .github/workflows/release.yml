name: Release Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows executable
        shell: pwsh
        run: ./build.ps1

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item bin/Clipify.exe release/Clipify.exe
          Compress-Archive -Path bin/Clipify.exe, bin/assets -DestinationPath release/Clipify-windows-amd64.zip -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipify-windows-assets
          path: |
            release/Clipify.exe
            release/Clipify-windows-amd64.zip

      - name: Resolve target tag
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" \
            release/Clipify.exe \
            release/Clipify-windows-amd64.zip \
            --clobber
